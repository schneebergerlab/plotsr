
[build-system]
requires = ["setuptools", "numpy"]
build-backend = "setuptools.build_meta"


[project]
name = "plotsr"
# project homepage: https://github.com/schneebergerlab/plotsr
authors = [
    {name = "Manish Goel", email="goel@mpipz.mpg.de"},
]
description = "visualizing structural similarities and rearrangements between multiple genomes"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["Structural Variation", "SV", "Pangenomics", "Bioinformatics", "Visualization"]
license = {text = "MIT"}
dependencies = [
	"numpy",
	"pandas",
	"matplotlib >= 3.9",
]
dynamic = ["version"]


[project.urls]
Homepage = "https://github.com/schneebergerlab/plotsr"
Documentation = "https://github.com/schneebergerlab/plotsr/blob/master/README.md"
Repository = "https://github.com/schneebergerlab/plotsr.git"
Issues = "https://github.com/schneebergerlab/plotsr/issues"


[project.scripts]
plotsr = "plotsr.plotsr:main"

[tool.setuptools]
packages = ["plotsr"]

[tool.setuptools.dynamic]
version = {attr = "plotsr.__version__"}
